<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Classes</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><div class="two-col"><section><div id="classes-grid" class="grid"></div></section><form id="class-form" class="card form-col"><h2 id="class-title">New class</h2><div><label for="name">Class name</label><input class="form-control" id="name" name="name" type="text" value="" required maxlength="20"></div><div><label for="roomId">Room</label><select class="form-select" id="roomId" ></select></div><div class="actions"><button type="button" id="new-room" class="btn btn-soft">New room…</button></div><div><label for="teacherId">Teacher</label><select class="form-select" id="teacherId" ></select></div><div><label for="capacity">Capacity</label><input class="form-control" id="capacity" name="capacity" type="number" value="20" required min="1" max="40"></div><button class="btn btn-primary" id="save-class">Create class</button><button type="button" id="cancel-edit" class="btn btn-outline-secondary">Clear</button></form></div><div class="modal fade" id="teacher-modal" tabindex="-1" aria-labelledby="teacher-title"><div class="modal-dialog"><form class="modal-content form-col" id="teacher-form"><div class="modal-header"><h2 id="teacher-title">Assign teacher</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div><label for="assign-id">Teacher</label><select class="form-select" id="assign-id" ></select></div></div><div class="modal-footer"><button class="btn btn-primary">Assign teacher</button></div></form></div></div></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/classes.js"></script></body></html>
