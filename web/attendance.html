<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Attendance</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><section class="card"><div class="toolbar"><button id="previous" class="btn btn-outline-secondary" aria-label="Previous school day">‹</button><div><label for="day">Day</label><input class="form-control" id="day" name="day" type="date" value="" ></div><button id="next" class="btn btn-outline-secondary" aria-label="Next school day">›</button><button id="today" class="btn btn-soft">Today</button><div id="saved-info"></div></div><div id="weekend" class="notice warn" hidden>No school on this day. Saturday and Sunday are weekend days.</div><div id="sheet"><div class="toolbar"><div id="counts"></div><button id="mark-all" class="btn btn-outline-secondary">Mark all present</button><button id="save" class="btn btn-primary">Save attendance</button><button id="correct" class="btn btn-soft" hidden>Correct this day</button></div><div id="attendance-grid" class="grid"></div></div></section></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/attendance.js"></script></body></html>
