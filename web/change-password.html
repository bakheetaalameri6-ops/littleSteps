<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Change password</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="login-form"><form id="change" class="card form-col"><h1>Change password</h1><p>Choose a new password before continuing.</p><div id="error" class="error-banner" role="alert"></div><div><label for="current">Current password</label><input class="form-control" id="current" name="current" type="password" value="" required autocomplete="current-password"></div><div><label for="next">New password</label><input class="form-control" id="next" name="next" type="password" value="" required minlength="8" maxlength="128" autocomplete="new-password"></div><div><label for="confirm">Confirm new password</label><input class="form-control" id="confirm" name="confirm" type="password" value="" required autocomplete="new-password"></div><button class="btn btn-primary">Change password</button><button type="button" id="cancel" class="btn btn-outline-secondary">Sign out</button></form></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/change-password.js"></script></body></html>
