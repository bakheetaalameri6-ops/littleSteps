<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Staff</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><div class="two-col"><section class="card"><div class="toolbar"><div><label for="search">Search staff</label><input class="form-control" id="search" name="search" type="text" value="" ></div><div><label for="filter-role">Role</label><select class="form-select" id="filter-role" ><option value="">All roles</option><option value="Teacher">Teacher</option><option value="Admin">Administration</option><option value="SecurityGuard">Security guard</option><option value="Manager">School management</option></select></div></div><div id="staff-list" class="table-wrap"></div></section><form id="staff-form" class="card form-col"><h2 id="form-title">New staff member</h2><div><label for="fullName">Full name</label><input class="form-control" id="fullName" name="fullName" type="text" value="" required maxlength="120"></div><div><label for="role">Role</label><select class="form-select" id="role" ><option value="Teacher">Teacher</option><option value="Admin">Administration</option><option value="SecurityGuard">Security guard</option><option value="Manager">School management</option></select></div><div><label for="username">Username</label><input class="form-control" id="username" name="username" type="text" value="" required maxlength="50" autocomplete="off"></div><div><label for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" value="" maxlength="20"></div><div><label for="temporaryPassword">Temporary password</label><input class="form-control" id="temporaryPassword" name="temporaryPassword" type="password" value="" required minlength="8" autocomplete="new-password"></div><p id="password-hint" class="muted">Must change at first sign-in.</p><button class="btn btn-primary" id="submit-staff">Create account</button><button type="button" id="clear" class="btn btn-outline-secondary">Clear</button></form></div></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/staff.js"></script></body></html>
