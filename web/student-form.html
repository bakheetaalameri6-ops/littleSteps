<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Student form</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><form id="student-form"><div class="two-col"><section class="card form-col"><h2>Photo</h2><div id="photo-preview"></div><div><label for="photo-file">Upload photo</label><input class="form-control" id="photo-file" name="photo-file" type="file" value="" accept="image/png,image/jpeg"></div><button type="button" id="remove-photo" class="btn btn-outline-secondary">Remove photo</button><div class="notice warn">You can save without a photo. The record will be marked <strong>Photo missing — incomplete</strong> and listed as pending.</div></section><div class="form-col"><section class="card"><h2>Student details</h2><div class="row g-3"><div class="col-md-6"><div><label for="studentCode">Student ID</label><input class="form-control" id="studentCode" name="studentCode" type="text" value="Generated automatically" readonly></div></div><div class="col-md-6"><div><label for="classId">Class</label><select class="form-select" id="classId" ></select></div></div><div class="col-md-6"><div><label for="firstName">First name</label><input class="form-control" id="firstName" name="firstName" type="text" value="" required maxlength="60"></div></div><div class="col-md-6"><div><label for="lastName">Last name</label><input class="form-control" id="lastName" name="lastName" type="text" value="" required maxlength="60"></div></div><div class="col-md-6"><div><label for="dateOfBirth">Date of birth</label><input class="form-control" id="dateOfBirth" name="dateOfBirth" type="date" value="" required></div></div><div class="col-md-6"><div><label for="gender">Gender</label><select class="form-select" id="gender" ><option value="M">Male</option><option value="F">Female</option></select></div></div></div></section><section class="card form-col"><h2>Responsible adults</h2><p class="muted">Only these adults can take the child home early.</p><div id="linked"></div><div><label for="link-id">Link a guardian by Emirates ID</label><input class="form-control" id="link-id" name="link-id" type="text" value="" placeholder="784-YYYY-NNNNNNN-N"></div><div><label for="relationship">Relationship</label><select class="form-select" id="relationship" ><option>Father</option><option>Mother</option><option>Other</option></select></div><button type="button" class="btn btn-soft" id="link">Link guardian</button><a href="guardian-form.html">Register new guardian</a></section><div class="actions"><a href="students.html" class="btn btn-outline-secondary">Cancel</a><button class="btn btn-primary" id="save">Save without photo</button></div></div></div></form></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/student-form.js"></script></body></html>
