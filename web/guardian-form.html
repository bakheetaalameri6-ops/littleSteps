<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Guardians</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><div class="two-col"><form id="guardian-form" class="card form-col"><h2 id="guardian-title">Register guardian</h2><div id="guardian-photo"></div><div><label for="guardian-photo-file">Change photo</label><input class="form-control" id="guardian-photo-file" name="guardian-photo-file" type="file" value="" accept="image/jpeg,image/png"></div><div><label for="emiratesId">Emirates ID</label><input class="form-control" id="emiratesId" name="emiratesId" type="text" value="" required placeholder="784-YYYY-NNNNNNN-N" pattern="784-[0-9]{4}-[0-9]{7}-[0-9]"></div><div id="id-validation" role="status"></div><div><label for="fullName">Full name</label><input class="form-control" id="fullName" name="fullName" type="text" value="" required maxlength="120"></div><div><label for="phone">Mobile phone</label><input class="form-control" id="phone" name="phone" type="tel" value="" required maxlength="20"></div><button class="btn btn-primary">Save guardian</button><button type="button" id="new-guardian" class="btn btn-outline-secondary">New guardian</button></form><section class="card form-col"><h2>Responsible for</h2><div id="children"></div><div><label for="child-search">Add child: search name or ID</label><input class="form-control" id="child-search" name="child-search" type="text" value="" ></div><div id="child-results"></div><div><label for="child-relationship">Relationship</label><select class="form-select" id="child-relationship" ><option>Father</option><option>Mother</option><option>Other</option></select></div></section></div><section class="card mt-4"><h2>Registered guardians</h2><div id="guardians-list" class="table-wrap"></div></section></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/guardian-form.js"></script></body></html>
