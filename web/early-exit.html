<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Early exit</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><div class="two-col"><div class="form-col"><section class="card form-col"><h2>1 · Find the child</h2><div><label for="search">Name or student ID</label><input class="form-control" id="search" name="search" type="text" value="" ></div><div id="results"></div><div id="selected"></div></section><form id="check-form" class="card form-col"><h2>2 · Check the adult's Emirates ID</h2><div><label for="emiratesId">Emirates ID</label><input class="form-control" id="emiratesId" name="emiratesId" type="text" value="" required pattern="784-[0-9]{4}-[0-9]{7}-[0-9]" placeholder="784-YYYY-NNNNNNN-N"></div><button class="btn btn-primary">Check</button><div id="exit-result" aria-live="polite"></div></form></div><section class="card"><h2>Registered responsible adults</h2><div id="adults"><p class="muted">Select a child to see their responsible adults.</p></div><p class="muted mt-3">Emirates ID numbers are not shown here. Only the check result is shown to the guard.</p></section></div><section class="card mt-4"><h2>Today's early-exit attempts</h2><div id="exits-list" class="table-wrap"></div></section></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/early-exit.js"></script></body></html>
