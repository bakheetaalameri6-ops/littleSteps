<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Sign in</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="login"><section class="login-brand"><div class="brand"><span class="logo">LS</span>LittleSteps</div><p class="slogan">Small steps, safe days.</p><div class="role-chips"><span>Administration</span><span>Teachers</span><span>Security guards</span><span>School management</span></div></section><section class="login-form"><form id="login" class="card form-col"><h1>Sign in</h1><p class="muted">Use the account given to you by the school administration.</p><div id="error" class="error-banner" role="alert"></div><div><label for="username">Username</label><input class="form-control" id="username" name="username" type="text" value="" required autocomplete="username" maxlength="50"></div><div><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" value="" required autocomplete="current-password" maxlength="128"></div><button class="btn btn-primary">Sign in</button><div class="notice">Every sign-in is recorded in the audit log. Sessions expire after 8 hours.</div></form></section></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/login.js"></script></body></html>
