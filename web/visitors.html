<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleSteps — Visitors</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header id="header"></header><div id="error" class="error-banner" role="alert"></div><div class="two-col"><form id="visitor-form" class="card form-col"><h2>Register visitor</h2><div><label for="fullName">Full name</label><input class="form-control" id="fullName" name="fullName" type="text" value="" required maxlength="120"></div><div><label for="emiratesId">Emirates ID</label><input class="form-control" id="emiratesId" name="emiratesId" type="text" value="" required placeholder="784-YYYY-NNNNNNN-N" pattern="784-[0-9]{4}-[0-9]{7}-[0-9]"></div><div><label for="reason">Reason</label><select class="form-select" id="reason" ><option>Meeting</option><option>Delivery</option><option>Maintenance</option><option>Parent visit</option><option>Other</option></select></div><div><label for="personVisited">Person visited</label><input class="form-control" id="personVisited" name="personVisited" type="text" value="" required maxlength="120"></div><div class="muted">Time in is recorded automatically.</div><button class="btn btn-primary">Register entry</button></form><section class="card"><div class="d-flex justify-content-between"><h2>Today</h2><span id="on-site" class="chip"></span></div><div id="visits-list" class="table-wrap"></div></section></div></main></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script><script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script><script src="config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/visitors.js"></script></body></html>
